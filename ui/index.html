<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Мыслик</title>
<link rel="icon" type="image/png" href="icon.png">
<link rel="stylesheet" href="vendor/tabler-icons.min.css?v=297">
<link rel="stylesheet" href="styles.css?v=297">
</head>
<body>
<div id="app">

  <!-- Полоса заголовка НЕ здесь: она рисуется нативно (см. _install_native_titlebar в app.py).
       Причина — Aero Snap: пока браузер накрывает окно целиком, Windows не видит перетаскивания
       и не показывает зоны привязки. Освободив верхние 40 px, отдаём полосу системе, и драг,
       Snap, дабл-клик и системное меню работают штатно. В браузере (дев-режим) полосы нет —
       окном там управляет сам браузер. -->

  <!-- Заголовок вида и его кнопки живут ЗДЕСЬ, а не отдельной полосой под захватом: та полоса
       съедала под полсотни пикселей высоты у графа и доски, ради которых окно и открывают. -->
  <div id="topbar">
    <!-- подписи вида тут нет: она объясняла жесты графа и в верхней полосе только отнимала
         место у строки захвата. Управление и так подсказывает плашка внизу самого графа -->
    <div id="view-head">
      <div id="main-title">Сегодня</div>
    </div>
    <div id="cap-wrap">
      <i class="ti ti-feather"></i>
      <input id="cap" type="text" placeholder="Сбрось мысль и Enter…   #область/#тег  завтра/пн/25.06  !приоритет  *заметка">
      <div id="cap-preview"></div>
    </div>
    <div class="head-actions" id="head-actions"></div>
    <div class="kbd" id="kbd-hint" title="Все горячие клавиши и жесты"><b>Ctrl</b>+<b>K</b> поиск</div>
  </div>

  <div id="body">
    <div id="side">
      <!-- кнопка разворота стоит первой и слева: внизу она смещалась при смене ширины
           панели, и после сворачивания её приходилось искать глазами -->
      <div class="side-toggles">
        <button class="side-toggle" id="side-wide" title="Показать названия"><i class="ti ti-layout-sidebar-left-expand"></i></button>
      </div>
      <nav id="nav"></nav>
      <!-- кнопка одна: правка и удаление области переехали в ПКМ по её кружку в графе -->
      <div class="side-h"><span class="side-h-txt">Области</span> <span class="side-h-btns"><button id="add-area" title="Новая область"><i class="ti ti-plus"></i></button></span></div>
      <div id="areas"></div>
      <div class="side-foot">
        <button class="foot-btn" id="f-export" title="Экспорт в файл"><i class="ti ti-download"></i></button>
        <button class="foot-btn" id="f-import" title="Импорт из файла"><i class="ti ti-upload"></i></button>
        <button class="foot-btn" id="f-timer" title="Таймер фокуса"><i class="ti ti-clock"></i></button>
        <button class="foot-btn" id="f-settings" title="Настройки"><i class="ti ti-settings"></i></button>
      </div>
      <div class="side-ver">
        <span class="sv-t" title="версия">Мыслик 2.0.1.1 <span>beta</span></span>
        <button class="sv-fb" id="f-feedback"><i class="ti ti-message-report"></i>Сообщить о проблеме</button>
      </div>
    </div>

    <div id="main">
      <!-- рабочая область делится на две части: слева текущий вид, справа выбранный элемент.
           Разделитель тянется мышью, ширина правой части запоминается в настройках. -->
      <div id="split">
        <div id="view"></div>
        <div id="splitter" title="Потяни, чтобы изменить ширину панели"></div>
        <aside id="aside"></aside>
      </div>
    </div>
  </div>

</div>

<div id="toast"></div>
<div id="overlay-root"></div>

<!-- модули загружаются как классические скрипты (общая глобальная область),
     порядок важен: core → model → views → graph → overlays → main.
     ES-модули НЕ используем: реальный аппа грузится по file://, где import блокируется CORS. -->
<script src="js/core.js?v=297"></script>
<script src="js/model.js?v=297"></script>
<script src="js/views.js?v=297"></script>
<script src="js/graph.js?v=297"></script>
<script src="js/overlays.js?v=297"></script>
<!-- доска (Excalidraw); сам вендор подгружается лениво, при первом заходе на вкладку -->
<script src="js/draw.js?v=297"></script>
<!-- локальный ИИ (умный захват) — опционально; нет движка/модели → молчит -->
<script src="js/ai.js?v=297"></script>
<!-- отчёт из выделенного (простой + через ИИ) -->
<script src="js/report.js?v=297"></script>
<script src="js/main.js?v=297"></script>
</body>
</html>
