<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мыслик — концепции каркаса</title>
<link rel="stylesheet" href="ui/vendor/tabler-icons.min.css">
<style>
/* КОНЦЕПЦИИ КАРКАСА: куда девать шапку, полосу слева и панель, не потеряв ни одной функции.
   Стиль намеренно ТЕКУЩИЙ (чёрный, тонкие рамки) — сравнивается раскладка, а не краска;
   стиль A или C ложится поверх любой из концепций. Справа — список всех функций оболочки:
   наведение подсвечивает, где функция живёт в выбранной концепции. */
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#050506;color:#ececef;font-family:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
.dm-head{flex:none;padding:10px 18px;border-bottom:1px solid rgba(255,255,255,.07);display:flex;gap:16px;align-items:flex-start}
.dm-title{font-size:14px;font-weight:600;white-space:nowrap;padding-top:6px}
.dm-title b{color:#e8a14b;font-weight:600}
.dm-tabs{display:flex;gap:4px;background:#111114;padding:3px;border-radius:10px;flex:none}
.dm-tab{font-size:13px;padding:6px 12px;border-radius:8px;color:#9a9aa3;white-space:nowrap}
.dm-tab.on{background:#26262c;color:#fff}
.dm-info{flex:1;font-size:12.5px;line-height:1.5;color:#a6a6ae;min-width:0}
.dm-info h3{margin:0 0 2px;font-size:13px;color:#f2f2f4;font-weight:600}
.dm-info .m{display:inline-flex;gap:14px;margin-top:4px;color:#6c6c75}
.dm-info .m b{color:#7fd0a8;font-weight:600}
.dm-body{flex:1;min-height:0;display:flex}
.dm-stage{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;padding:12px;overflow:hidden}
.dm-scaler{width:1600px;height:900px;transform-origin:center;flex:none;border-radius:10px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.08)}
.dm-list{width:330px;flex:none;border-left:1px solid rgba(255,255,255,.07);overflow:auto;padding:12px 14px 20px;font-size:12.5px;scrollbar-width:thin}
.dm-list h4{margin:14px 0 6px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#6c6c75;font-weight:600}
.dm-list h4:first-child{margin-top:0}
.fi{display:block;width:100%;text-align:left;padding:6px 8px;border-radius:8px;line-height:1.35}
.fi:hover,.fi.pin{background:#18181c}
.fi b{display:block;font-weight:500;color:#ececef}
.fi span{color:#8a8a93;font-size:11.5px}
.fi.moved span{color:#e6c38f}
.dm-hint{font-size:11.5px;color:#6c6c75;margin-bottom:6px}

/* ---------- приложение в ТЕКУЩЕМ стиле ---------- */
#app{width:1600px;height:900px;position:relative;background:#000;color:#f4f4f5;overflow:hidden;font-size:11px;
  --bd:rgba(255,255,255,.13);--bd2:rgba(255,255,255,.26);--surf:#0c0c0e;--surf2:#161618;--mut:#86868c;--mut2:#5b5b61}
.abs{position:absolute}
.bx{border:1px solid var(--bd);border-radius:7px;background:#000}
.ib{width:30px;height:28px;display:inline-flex;align-items:center;justify-content:center;font-size:14px;color:var(--tx,#f4f4f5)}
.ib.b{border:1px solid var(--bd);border-radius:7px}
.ib.on{background:#fff;color:#000;border-radius:7px}
.row{display:flex;align-items:center;gap:6px}
.winctl{display:flex;gap:20px;color:var(--mut);font-size:13px;align-items:center}
.cap{display:flex;align-items:center;gap:8px;border:1px solid var(--bd);border-radius:7px;background:var(--surf);color:var(--mut2);padding:0 10px;font-size:10.5px;white-space:nowrap;overflow:hidden}
.cap i{font-size:12px}
.vseg{display:flex;gap:4px}
.vseg span{height:28px;padding:0 10px;border:1px solid var(--bd);border-radius:7px;display:flex;align-items:center;gap:5px;font-size:10.5px}
.vseg span.on{background:#fff;color:#000}
.kbtn{height:26px;padding:0 8px;border:1px solid var(--bd);border-radius:7px;display:flex;align-items:center;gap:4px;font-size:9.5px;color:var(--mut)}
.kbtn b{color:#f4f4f5}
.canvas{position:absolute;overflow:hidden;background:#000}
.canvas svg{position:absolute;inset:0;width:100%;height:100%}
.legend{display:flex;gap:12px;font-size:8.5px;color:var(--mut)}
.selc{font-size:9px;color:var(--mut);border:1px solid var(--bd);border-radius:6px;padding:3px 8px}
.rail{display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 0;color:var(--mut)}
.rail .ib{font-size:13px}
.rail .grp{display:flex;flex-direction:column;align-items:center;gap:8px}
.rail .sep{width:20px;height:1px;background:var(--bd)}
.island{position:absolute;display:flex;align-items:center;gap:4px;padding:4px;border-radius:11px;background:rgba(14,14,16,.92);border:1px solid var(--bd);box-shadow:0 8px 24px rgba(0,0,0,.5);z-index:3}
.island .ib{border-radius:8px}
.island .sp{width:1px;height:18px;background:var(--bd);margin:0 3px}
.chipa{height:24px;padding:0 9px;border-radius:999px;border:1px solid var(--bd);display:inline-flex;align-items:center;gap:5px;font-size:10px;color:#d8d8dc;background:rgba(10,10,12,.9)}
.chipa i{font-size:11px}
.gsw{display:flex;align-items:center;gap:6px;height:28px;padding:0 9px;border-radius:7px;font-size:11px;font-weight:600}
.gsw:hover{background:var(--surf2)}
.gsw .gi{width:18px;height:18px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:11px;background:rgba(111,155,216,.2);color:#8fb4ea}
.crumb{display:flex;align-items:center;gap:4px;color:var(--mut);font-size:10.5px}
.menu{position:absolute;z-index:20;background:#121214;border:1px solid var(--bd2);border-radius:10px;padding:5px;box-shadow:0 14px 40px rgba(0,0,0,.6);font-size:11px}
.menu .mi{display:flex;align-items:center;gap:8px;height:28px;padding:0 9px;border-radius:7px;white-space:nowrap}
.menu .mi i{font-size:13px;color:var(--mut)}
.menu .mi .k{margin-left:auto;color:var(--mut2);font-size:9.5px;padding-left:16px}
.menu .hd{font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut2);padding:6px 9px 3px}
.menu hr{border:0;border-top:1px solid var(--bd);margin:4px 0}

/* панель ноды — как в приложении */
.panel{position:absolute;border:1px solid var(--bd);border-radius:10px;background:#000;padding:14px;overflow:hidden;z-index:4}
.n-h{display:flex;align-items:center;justify-content:space-between;font-size:15px;font-weight:600;margin-bottom:12px}
.n-h .a{display:flex;gap:12px;font-size:12px;color:var(--mut)}
.n-row{display:grid;grid-template-columns:78px 20px 1fr;align-items:center;height:25px;font-size:9.5px}
.n-row .k{color:var(--mut)}
.n-row .ic{color:var(--mut);font-size:11px}
.n-row .v{font-weight:600;display:flex;align-items:center;gap:6px;min-width:0;white-space:nowrap;overflow:hidden}
.n-row .v.t{font-weight:400}
.qs{display:flex;gap:4px}
.qs span{border:1px solid var(--bd);border-radius:4px;padding:1px 7px;font-size:8px;color:var(--mut);font-weight:400}
.n-desc{border:1px solid var(--bd);border-radius:6px;height:70px;margin:12px 0 10px;padding:9px;color:var(--mut2);font-size:9.5px}
.n-line{display:flex;align-items:center;gap:6px;font-size:8.5px;color:var(--mut);margin:6px 0;flex-wrap:wrap}
.n-line span{border:1px solid var(--bd);border-radius:5px;padding:3px 7px;color:#f4f4f5}
.n-rel{border:1px solid var(--bd);border-radius:5px;height:24px;display:flex;align-items:center;justify-content:space-between;padding:0 9px;font-size:9.5px;margin:4px 0}
.n-rel small{color:var(--mut2);font-size:7.5px}
.n-btn{border:1px solid var(--bd2);border-radius:6px;height:28px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:9.5px;font-weight:600;margin-top:10px}
.split{position:absolute;width:4px;height:40px;border-radius:3px;background:#2a2a2e;z-index:5}

/* омнибокс */
.omni{position:absolute;z-index:6;border:1px solid var(--bd2);border-radius:10px;background:#0e0e10;box-shadow:0 20px 50px rgba(0,0,0,.6)}
.omni .in{height:34px;display:flex;align-items:center;gap:8px;padding:0 10px;font-size:11.5px;border-bottom:1px solid var(--bd)}
.omni .in .cur{width:1px;height:14px;background:#e8a14b;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.otok{font-size:9.5px;padding:1px 6px;border-radius:5px}
.omni .sec{padding:6px}
.omni .hd{font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut2);padding:4px 8px}
.omni .it{display:flex;align-items:center;gap:8px;height:28px;padding:0 8px;border-radius:7px;font-size:11px}
.omni .it.on{background:#1b1b1f}
.omni .it i{font-size:13px;color:var(--mut)}
.omni .it .k{margin-left:auto;font-size:9.5px;color:var(--mut2)}
.omni .ft{display:flex;gap:14px;padding:6px 12px;border-top:1px solid var(--bd);font-size:9.5px;color:var(--mut2)}
.omni .ft b{color:#d0d0d4;font-weight:500}
.drawer{position:absolute;z-index:7;background:#0b0b0d;border-right:1px solid var(--bd2);box-shadow:20px 0 50px rgba(0,0,0,.6);padding:12px 10px;font-size:11px;display:flex;flex-direction:column}
.drawer .hd{font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut2);padding:8px 8px 4px;display:flex;align-items:center}
.drawer .hd i{margin-left:auto;font-size:12px}
.drawer .it{display:flex;align-items:center;gap:8px;height:28px;padding:0 8px;border-radius:7px}
.drawer .it.on{background:#1b1b1f}
.drawer .it .n{margin-left:auto;color:var(--mut2);font-size:9.5px}
.drawer .gi{width:18px;height:18px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:11px}
/* карточка у ноды */
.ncard{position:absolute;z-index:6;width:300px;border:1px solid var(--bd2);border-radius:12px;background:#0d0d0f;box-shadow:0 18px 50px rgba(0,0,0,.65);padding:12px;font-size:11px}
.ncard::before{content:"";position:absolute;left:-7px;top:26px;width:12px;height:12px;background:#0d0d0f;border-left:1px solid var(--bd2);border-bottom:1px solid var(--bd2);transform:rotate(45deg)}
.ncard h5{margin:0;font-size:14px;display:flex;align-items:center;gap:8px}
.ncard h5 .a{margin-left:auto;display:flex;gap:10px;color:var(--mut);font-size:12px}
.ncard .ln{display:flex;align-items:center;gap:8px;margin-top:9px;color:var(--mut);font-size:10px}
.ncard .ln .v{color:#f4f4f5;font-size:10.5px;display:flex;gap:4px;align-items:center}
.ncard .sub{display:flex;align-items:center;gap:8px;height:24px;font-size:10.5px}
.ncard .cb{width:13px;height:13px;border:1.5px solid var(--bd2);border-radius:4px}
.ncard .ft{display:flex;gap:6px;margin-top:10px}
.ncard .ft span{flex:1;height:26px;border:1px solid var(--bd);border-radius:7px;display:flex;align-items:center;justify-content:center;gap:5px;font-size:10px}
.ncard .ft span.pr{background:#fff;color:#000;border-color:#fff;font-weight:600}
.sover{position:absolute;z-index:8;box-shadow:-30px 0 60px rgba(0,0,0,.7)}

/* подсветка места функции */
.hl{position:absolute;z-index:100;pointer-events:none;border:2px solid #4cc9ff;border-radius:9px;box-shadow:0 0 0 4px rgba(76,201,255,.18),0 0 24px rgba(76,201,255,.5);animation:hp 1.2s ease-in-out infinite}
.hl b{position:absolute;left:-2px;top:-24px;white-space:nowrap;background:#4cc9ff;color:#001a26;font:600 11px "Segoe UI",sans-serif;padding:3px 7px;border-radius:6px}
.hl.dn b{top:auto;bottom:-24px}
@keyframes hp{50%{box-shadow:0 0 0 7px rgba(76,201,255,.08),0 0 30px rgba(76,201,255,.6)}}
.measure{position:absolute;z-index:90;pointer-events:none;border:1.5px dashed rgba(127,208,168,.55);border-radius:6px}
.measure span{position:absolute;right:6px;bottom:6px;background:rgba(10,30,20,.85);color:#7fd0a8;font:600 11px "Segoe UI",sans-serif;padding:3px 7px;border-radius:6px}
</style>
</head>
<body>
<div class="dm-head">
  <div class="dm-title">Мыслик · <b>концепции каркаса</b></div>
  <div class="dm-tabs" id="tabs"></div>
  <div class="dm-info" id="info"></div>
</div>
<div class="dm-body">
  <div class="dm-stage" id="stage"><div class="dm-scaler" id="scaler"><div id="app"></div></div></div>
  <div class="dm-list" id="list"></div>
</div>
<script>
/* ===================== граф — ровно как рисует приложение сейчас ===================== */
const C={shot:"#e8a14b",render:"#e0625a",build:"#6f9bd8",sq:"#9d7fe0",sfc:"#d9607a",note:"#6f9bd8"};
const N=[],E=[];
const add=(id,label,type,x,y,color,ex)=>{ const n={id,label,type,x,y,color,...(ex||{})}; N.push(n); return n; };
const SFC=add("sfc","SFC_2026","hub",300,610,C.sfc), SQ1=add("sq1","SQ01","hub",150,390,C.sq), SQ2=add("sq2","SQ02","hub",600,560,C.sq), LOC=add("loc","Локация","note",320,445,C.note);
E.push([SFC,SQ1],[SFC,SQ2],[SFC,LOC]);
const pol=(h,d,r)=>[h.x+r*Math.cos(d*Math.PI/180),h.y+r*Math.sin(d*Math.PI/180)];
const kids=(s,p)=>{ const a=Math.atan2(s.y-p.y,s.x-p.x); [[-0.55,"Рендер",C.render],[0.55,"Сборка",C.build]].forEach(([d,l,c],i)=>{ const k=add(s.id+i,l,"task",s.x+62*Math.cos(a+d),s.y+62*Math.sin(a+d),c); E.push([s,k]); }); };
[["SH030",250,200],["SH040",300,170]].forEach(([l,d,r])=>{ const [x,y]=pol(SQ1,d,r); const s=add("a"+l,l,"shot",x,y,C.shot); E.push([SQ1,s]); kids(s,SQ1); });
let SH030;
[["SH010",198,205],["SH020",224,150],["SH030",252,200],["SH035",274,270],["SH040",298,175],["SH041",318,262],["SH050",342,195],["SH060",6,205],["SH070",36,215],["SH080",118,195]]
  .forEach(([l,d,r])=>{ const [x,y]=pol(SQ2,d,r); const s=add("b"+l,l,"shot",x,y,C.shot); E.push([SQ2,s]); kids(s,SQ2); if(l==="SH030") SH030=s; });
const SH036=add("sh036","SH036","shot",SH030.x+58,SH030.y-150,C.shot,{sel:1}); E.push([SH030,SH036]); kids(SH036,SH030);
const hexA=(h,a)=>{ const n=parseInt(h.slice(1),16); return `rgba(${n>>16},${(n>>8)&255},${n&255},${a})`; };
const dia=(x,y,r)=>`${x},${y-r} ${x+r},${y} ${x},${y+r} ${x-r},${y}`;
function graphSVG(){
  let s=`<defs><filter id="gl" x="-1" y="-1" width="3" height="3"><feGaussianBlur stdDeviation="5"/></filter></defs>`;
  let sd=7; const r=()=>(sd=(sd*16807)%2147483647)/2147483647;
  for(let i=0;i<110;i++) s+=`<circle cx="${(r()*1000).toFixed(0)}" cy="${(r()*820).toFixed(0)}" r="${(r()*1+.3).toFixed(2)}" fill="#fff" opacity="${(r()*.35).toFixed(2)}"/>`;
  E.forEach(([a,b])=>{ s+=`<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${a.type==="hub"?hexA(a.color,.7):hexA(b.color,.75)}" stroke-width="1"/>`; });
  N.forEach(n=>{ const c=n.color;
    if(n.sel) s+=`<polygon points="${dia(n.x,n.y,15)}" fill="${hexA(c,.5)}" filter="url(#gl)"/>`;
    if(n.type==="hub") s+=`<circle cx="${n.x}" cy="${n.y}" r="13" fill="#000" stroke="${c}" stroke-width="1.5"/><rect x="${n.x-4.5}" y="${n.y-4.5}" width="9" height="9" rx="1.5" fill="none" stroke="${c}" stroke-width="1.3"/>`;
    else if(n.type==="shot") s+=`<polygon points="${dia(n.x,n.y,n.sel?12:10)}" fill="${n.sel?hexA(c,.35):"#000"}" stroke="${c}" stroke-width="${n.sel?2.2:1.5}"/><rect x="${n.x-3}" y="${n.y-2.5}" width="6" height="5" fill="none" stroke="${c}" stroke-width="1"/>`;
    else if(n.type==="note") s+=`<circle cx="${n.x}" cy="${n.y}" r="6.5" fill="#000" stroke="${c}" stroke-width="1.5"/>`;
    else s+=`<rect x="${n.x-6}" y="${n.y-6}" width="12" height="12" fill="#000" stroke="${c}" stroke-width="1.5"/>`;
    s+=`<text x="${n.x}" y="${n.y+(n.type==="hub"?27:22)}" text-anchor="middle" font-size="9.5" fill="${n.sel?"#fff":"#b4b4ba"}" font-weight="${n.sel?600:400}" font-family="Segoe UI">${n.label}</text>`; });
  return s;
}

/* ===================== куски оболочки ===================== */
const AREAS=[["ti-video","#f0b770","Работа"],["ti-home","#f0b770","Дом"],["ti-puzzle","#8fb4ea","Аддоны"],["ti-plant","#7fd0a8","Сад"],["ti-code","#ee8a83","Код"],["ti-briefcase","#ee8a83","Студия"]];
const GRAPHS=[["ti-briefcase","#8fb4ea","Мой граф",64],["ti-rocket","#7fd0a8","Идеи",18]];
const win=`<div class="winctl" data-f="win"><i class="ti ti-minus"></i><i class="ti ti-square"></i><i class="ti ti-x"></i></div>`;
const vseg=`<div class="vseg" data-f="views"><span class="on"><i class="ti ti-affiliate"></i>Граф</span><span><i class="ti ti-layout-grid"></i>Список</span></div>`;
const kbtn=`<div class="kbtn" data-f="cmdk"><b>Ctrl+K</b> поиск</div>`;
const gtools=(cls="")=>`<div class="row ${cls}"><span class="ib b" data-f="gsearch"><i class="ti ti-search"></i></span><span class="ib b" data-f="gfocus"><i class="ti ti-focus-2"></i></span><span class="ib on" data-f="ghome"><i class="ti ti-home"></i></span><span class="ib b" data-f="gheat"><i class="ti ti-flame"></i></span><span class="ib b" data-f="gmore"><i class="ti ti-dots"></i></span></div>`;
const legend=`<div class="legend" data-f="legend"><span>● область</span><span>○ заметка</span><span>□ задача</span><span>◇ полотно</span><span>● подграф</span></div>`;
const selc=`<div class="selc" data-f="selbar">Выделено: 1</div>`;
const gsw=`<div class="gsw" data-f="graphs"><span class="gi"><i class="ti ti-briefcase"></i></span>Мой граф<i class="ti ti-chevron-down" style="font-size:11px;color:var(--mut)"></i></div>`;
const crumb=`<div class="crumb" data-f="sub"><i class="ti ti-chevron-right"></i>SFC_2026<i class="ti ti-chevron-right"></i>SQ02</div>`;
function panelHTML(){ return `
  <div class="n-h">SH036 <span class="a"><i class="ti ti-sparkles"></i><i class="ti ti-pencil"></i><i class="ti ti-x"></i></span></div>
  <div class="n-row"><span class="k">Тип</span><span></span><span class="v">Задача <i class="ti ti-chevron-down"></i></span></div>
  <div class="n-row"><span class="k">Область</span><span class="ic"><i class="ti ti-video"></i></span><span class="v">Работа <i class="ti ti-chevron-down"></i><span style="color:var(--mut2);font-weight:400;font-size:8px">наследуется</span></span></div>
  <div class="n-row"><span class="k">Статус</span><span class="ic"><i class="ti ti-clock"></i></span><span class="v">Не начато <i class="ti ti-chevron-down"></i></span></div>
  <div class="n-row" style="height:40px"><span class="k">Срок</span><span class="ic"><i class="ti ti-calendar"></i></span><span class="v t" style="display:block"><span style="color:var(--mut)">Без срока</span><div class="qs" style="margin-top:3px"><span>сег</span><span>зв</span><span>+3</span><span>пт</span></div></span></div>
  <div class="n-row"><span class="k">Приоритет</span><span class="ic"><i class="ti ti-flag"></i></span><span class="v">— <i class="ti ti-chevron-down"></i></span></div>
  <div class="n-row"><span class="k">Повтор</span><span class="ic"><i class="ti ti-repeat"></i></span><span class="v">не повторяется <i class="ti ti-chevron-down"></i></span></div>

/* ===================== отрисовка и подсветка ===================== */
let cur="now", pinned=null;
const app=document.getElementById("app");
function render(){
  app.innerHTML=CONCEPTS[cur].build();
  const g=document.getElementById("g"); if(g) g.innerHTML=graphSVG();
  placeCard(); measure(); renderList(); renderInfo();
  if(pinned) highlight(pinned);
}
function k(){ return app.getBoundingClientRect().width/1600; }
function rel(el){ const a=app.getBoundingClientRect(), r=el.getBoundingClientRect(), s=k(); return {x:(r.left-a.left)/s,y:(r.top-a.top)/s,w:r.width/s,h:r.height/s}; }
function placeCard(){
  const c=document.getElementById("ncard"), g=document.getElementById("g"); if(!c||!g) return;
  const m=g.getScreenCTM(), p=g.createSVGPoint(); p.x=SH036.x; p.y=SH036.y; const q=p.matrixTransform(m);
  const a=app.getBoundingClientRect(), s=k(); c.style.left=((q.x-a.left)/s+26)+"px"; c.style.top=((q.y-a.top)/s-32)+"px";
}
let area0=null;
function measure(){
  const cv=document.getElementById("canvas"); if(!cv) return;
  // видимая под граф область = холст минус то, что перекрывает плавающая панель или карточка
  const r=rel(cv); let w=r.w, x=r.x;
  const pnl=document.querySelector(".panel"); if(pnl){ const p=rel(pnl); if(p.x<r.x+r.w&&p.x+p.w>r.x){ w=Math.min(w,p.x-r.x-8); } }
  const area=w*r.h; if(cur==="now") area0=area; const base=area0||(  (1600-64-772)*808 );
  const pct=Math.round(area/(1600*900)*100), gain=Math.round((area/base-1)*100);
  const m=document.createElement("div"); m.className="measure"; Object.assign(m.style,{left:x+"px",top:r.y+"px",width:w+"px",height:r.h+"px"});
  m.innerHTML=`<span>граф: ${Math.round(w)}×${Math.round(r.h)} · ${pct}% окна${cur==="now"?"":` · ${gain>=0?"+":""}${gain}% к нынешнему`}</span>`;
  app.appendChild(m); CONCEPTS[cur]._pct=pct; CONCEPTS[cur]._gain=gain;
}
function clearHL(){ app.querySelectorAll(".hl").forEach(x=>x.remove()); }
function highlight(key){
  clearHL(); const name=F.flatMap(g=>g[1]).find(x=>x[0]===key);
  const els=[...app.querySelectorAll("[data-f]")].filter(e=>e.dataset.f.split(" ").includes(key)&&e.getClientRects().length);
  // если функция живёт в закрытом меню — подсвечиваем кнопку, которая его открывает
  els.forEach(e=>{ const r=rel(e); const h=document.createElement("div"); h.className="hl"+(r.y<40?" dn":"");
    Object.assign(h.style,{left:(r.x-4)+"px",top:(r.y-4)+"px",width:(r.w+8)+"px",height:(r.h+8)+"px"});
    h.innerHTML=`<b>${name?name[1]:key}</b>`; app.appendChild(h); });
}
function renderList(){
  const L=document.getElementById("list");
  L.innerHTML=`<div class="dm-hint">Наведи на функцию — на макете подсветится, где она в этой концепции. Клик закрепляет. <span style="color:#e6c38f">Жёлтым</span> — то, что переехало.</div>`+
    F.map(([grp,items])=>`<h4>${grp}</h4>`+items.map(([key,name,wh])=>{ const moved=cur!=="now"&&wh[cur]!==wh.now;
      return `<button class="fi ${moved?"moved":""} ${pinned===key?"pin":""}" data-k="${key}"><b>${name}</b><span>${wh[cur]}</span></button>`; }).join("")).join("");
}
function renderInfo(){
  const c=CONCEPTS[cur];
  document.getElementById("info").innerHTML=`<h3>${c.t}</h3>${c.d}`;
  document.getElementById("tabs").innerHTML=Object.entries(CONCEPTS).map(([id,x])=>`<button class="dm-tab ${id===cur?"on":""}" data-c="${id}">${x.tab}</button>`).join("");
}
document.getElementById("tabs").onclick=e=>{ const b=e.target.closest("[data-c]"); if(!b) return; cur=b.dataset.c; st={menu:null,drawer:false,omni:cur==="k3",expand:false}; render(); fit(); };
const list=document.getElementById("list");
list.addEventListener("mouseover",e=>{ const b=e.target.closest(".fi"); if(b) highlight(b.dataset.k); });
list.addEventListener("mouseleave",()=>{ if(pinned) highlight(pinned); else clearHL(); });
list.addEventListener("click",e=>{ const b=e.target.closest(".fi"); if(!b) return; pinned=pinned===b.dataset.k?null:b.dataset.k; renderList(); pinned?highlight(pinned):clearHL(); });
app.addEventListener("click",e=>{
  const o=e.target.closest("[data-open]");
  if(o){ const w=o.dataset.open;
    if(w==="logo") st.menu=st.menu==="logo"?null:"logo";
    if(w==="drawer") st.drawer=!st.drawer;
    if(w==="omni") st.omni=!st.omni;
    if(w==="expand") st.expand=!st.expand;
    render(); return; }
  if(e.target.closest('[data-f~="graphs"].gsw')){ st.menu=st.menu==="graph"?null:"graph"; render(); return; }
  if(st.menu){ st.menu=null; render(); }
});
function fit(){ const s=document.getElementById("stage"), sc=document.getElementById("scaler");
  sc.style.transform=`scale(${Math.max(.2,Math.min((s.clientWidth-24)/1600,(s.clientHeight-24)/900))})`; requestAnimationFrame(()=>{ render0(); }); }
let first=true;
function render0(){ if(first){ first=false; } render(); }
addEventListener("resize",fit);
// сначала «Сейчас», чтобы знать базовую площадь графа для процентов
cur="now"; render(); fit();
</script>
